<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <style>  :root {
    --bg: #070707;
    --fg: #f4f4f6;
    --muted: rgba(244, 244, 246, 0.55);
    --rim: rgba(255, 255, 255, 0.22);
    --glass: rgba(255, 255, 255, 0.07);
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  [hidden] {
    display: none !important;
  }

  html,
  body {
    height: 100%;
  }

  body {
    font-family: "Inter", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    cursor: pointer;
  }

  /* ---------- 背景 ---------- */
  .ambient {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
  }

  .ambient i {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
  }

  .ambient i:nth-child(1) {
    width: 52vmax;
    height: 52vmax;
    left: -16vmax;
    top: -18vmax;
    background: #3a3a46;
  }

  .ambient i:nth-child(2) {
    width: 44vmax;
    height: 44vmax;
    right: -14vmax;
    top: 28vh;
    background: #1f2b36;
  }

  .ambient i:nth-child(3) {
    width: 36vmax;
    height: 36vmax;
    left: 18vw;
    bottom: -20vmax;
    background: #2e2e2e;
  }

  /* ---------- Liquid Glass ---------- */
  .glass {
    position: relative;
    isolation: isolate;
    background: var(--glass);
    border: 1px solid var(--rim);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.3),
      inset 0 -1px 0 rgba(0, 0, 0, 0.25),
      0 12px 32px -12px rgba(0, 0, 0, 0.7);
  }

  .refract .glass {
    backdrop-filter: var(--f) blur(1.5px) saturate(180%);
    -webkit-backdrop-filter: var(--f) blur(1.5px) saturate(180%);
  }

  .plain .glass {
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
  }

  .glass::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    border-radius: inherit;
    pointer-events: none;
    background: radial-gradient(circle at var(--lx, 50%) var(--ly, 0%), rgba(255, 255, 255, 0.2), transparent 60%);
  }

  /* ---------- 表示 ---------- */
  .orb {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    display: grid;
    place-items: center;
  }

  .ring {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, 0.2);
    border-top-color: var(--fg);
    animation: spin 0.9s linear infinite;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  .error {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    max-width: 340px;
    padding: 24px;
    border-radius: 24px;
    text-align: center;
  }

  .error p {
    color: var(--muted);
    font-size: 0.84rem;
    line-height: 1.7;
  }

  .solid {
    height: 38px;
    padding: 0 20px;
    border-radius: 999px;
    background: var(--fg);
    color: #000;
    font-size: 0.84rem;
    font-weight: 500;
  }

  .ghost {
    height: 38px;
    padding: 0 20px;
    border-radius: 999px;
    border: 1px solid var(--rim);
    font-size: 0.84rem;
    font-weight: 500;
  }

  .actions {
    display: flex;
    gap: 8px;
  }

  .prompt {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    max-width: 340px;
    padding: 24px;
    border-radius: 24px;
    text-align: center;
  }

  .prompt p {
    color: var(--muted);
    font-size: 0.84rem;
    line-height: 1.7;
  }

  .info {
    font-size: 1px;
    color: #FFFFFF00;
  }</style>

  <div class="info">
    <h1>情報モラル学習サイト</h1>
    <h2>～スマホ・タブレットやネットを上手に活用できるかな？～</h2>
    <p>情報モラルとは、みなさんが情報社会の中で上手に生きていくために必要な考え方や態度のことです。</p>
    <p>このサイトでは、写真やイラスト、動画を見ながら約3つの問題に挑戦することで、情報モラルについて学ぶことができます。</p>
    <p>活用場面ごとに、いろいろな問題に挑戦することができます。それぞれ約5分〜10分で学習できます。</p>
    <p>小学校1年生～高校3年生が対象です。推奨学年にこだわらず、学びたいものを自由に学んでみましょう。</p>
  </div>

    <span class="ring"></span>

    <p id="error-msg"></p>
